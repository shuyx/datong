        audioModeBadge.textContent = "";
        audioModeBadge.removeAttribute("data-tone");
        return;
      }

      const label = mode === "original" ? "原始音频" : "净化音频";
      audioModeBadge.hidden = false;
      audioModeBadge.textContent = label;
      audioModeBadge.dataset.tone = mode;
    }

    function audioSourcesForChapter(chapter) {
      return {
        enhanced: `assets/audio-enhanced/${chapter.id}.m4a`,
        original: `assets/audio/${chapter.id}.m4a`
      };
    }

    function renderPlayPauseIcon(isPlaying) {
      playPauseButton.classList.toggle("playing", isPlaying);
      playPauseButton.setAttribute("aria-label", isPlaying ? "暂停" : "播放");
      playPauseIcon.innerHTML = isPlaying
        ? '<path d="M8 6h3v12H8z"></path><path d="M13 6h3v12h-3z"></path>'
        : '<path d="M8 6v12l10-6z"></path>';
    }

    function renderMuteIcon(isMuted) {
      muteButton.setAttribute("aria-label", isMuted ? "取消静音" : "静音");
      muteIcon.innerHTML = isMuted
        ? '<path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M16 9l5 6"></path><path d="M21 9l-5 6"></path>'
        : '<path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path>';
    }

    function syncPlayerUi() {
      const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : 0;
      const current = Number.isFinite(audioPlayer.currentTime) ? audioPlayer.currentTime : 0;
      const ratio = duration > 0 ? Math.min(1000, Math.max(0, Math.round((current / duration) * 1000))) : 0;

      currentTimeLabel.textContent = formatTime(current);
      durationLabel.textContent = formatTime(duration);
      seekBar.value = String(ratio);
      renderPlayPauseIcon(!audioPlayer.paused && !audioPlayer.ended);
      renderMuteIcon(audioPlayer.muted);
    }

    function updatePlayerVisual(site, chapter = null) {
      const artSrc = chapter?.image || site?.image || "";
      const artAlt = chapter ? `${site.name} · ${chapter.title}` : (site?.imageAlt || `${site?.name || "景点"}主图`);
      playerArt.src = artSrc;
      playerArt.alt = artAlt;
    }

    function normalizeSlideFocusItem(value) {
      return String(value || "")
        .replace(/\s+/g, " ")
        .replace(/([\u4e00-\u9fff])\s+([\u4e00-\u9fff])/g, "$1$2")
        .replace(/([\u4e00-\u9fff])\s+(\d)/g, "$1$2")
        .replace(/(\d)\s+([\u4e00-\u9fff])/g, "$1$2")
        .trim();
    }

    function getSlideFocusItems(type, rowsOrBullets, chapter, site) {
      if (type === "site-overview") {
        return rowsOrBullets?.bullets || site?.overview?.highlights || [];
      }

      if (type === "sources") {
        return (rowsOrBullets?.items || []).map(item => item.label);
      }

      if (type === "source-map") {
        return (rowsOrBullets?.groups || []).map(item => item.source);
      }

      if (type === "spotlight") {
        return (rowsOrBullets?.steps || []).map(item => item.title || item.label || "");
      }

      if (type === "workflow" || type === "verify") {
        return (rowsOrBullets?.cards || []).map(item => item.value);
      }

      return Array.isArray(rowsOrBullets) ? rowsOrBullets : chapter?.shots || [];
    }

    function buildAutoSlideBullets(type, rowsOrBullets, chapter, site) {
      if (!chapter) {
        if (type === "image") {
          return site?.overview?.highlights || [];
        }

        if (type === "shots" || type === "diagram") {
          return Array.isArray(rowsOrBullets) ? rowsOrBullets : [];
        }

        return [];
      }

      const [first, second, third] = getSlideFocusItems(type, rowsOrBullets, chapter, site)
        .map(normalizeSlideFocusItem);
      const fallbackTitle = normalizeSlideFocusItem(chapter.title);

      if (type === "archive") {
        return buildObservationBullets(chapter, site?.name || "通用");
      }

      if (type === "diagram") {
        return [
          `先看${first || fallbackTitle}。`,
          `再看${second || first || fallbackTitle}和它的关系线。`,
          `最后看${third || second || first || fallbackTitle}，确认这段结构或时间顺序。`
        ];
      }

      if (type === "image") {
        return [
          `先看${first || fallbackTitle}。`,
          `再看${second || first || fallbackTitle}。`,
          `最后看${third || second || first || fallbackTitle}。`
        ];
      }

      if (type === "spotlight") {
        return [
          `先看${first || fallbackTitle}。`,
          `再看${second || first || fallbackTitle}。`,
          `最后看${third || second || first || fallbackTitle}。`
        ];
      }

      if (type === "shots") {
        return [
          `先看${first || fallbackTitle}。`,
          `再看${second || first || fallbackTitle}。`,
          `最后看${third || second || first || fallbackTitle}。`
        ];
      }

      return chapter?.shots || [];
    }

    function buildSlideFacts(type, rowsOrBullets, chapter, site, meta = {}) {
      if (type === "spotlight" && Array.isArray(rowsOrBullets?.steps) && rowsOrBullets.steps.length === 1 && meta.compact !== false) {
        return [];
      }

      if (Array.isArray(meta.facts) && meta.facts.length) {
        return meta.facts;
      }

      if (type === "site-overview") {
        return [
          { label: "内容点", value: `${(site?.chapters || []).length} 段` },
          { label: "音频版本", value: siteAudioReadyLabel(site) },
          { label: "素材源", value: siteSourceLabel(site) },
          { label: "建议入口", value: site?.overview?.facts?.[0]?.value || "先总览后进章节" }
        ];
      }

      if (type === "sources") {
        return [
          { label: "素材源", value: siteSourceLabel(site) },
          { label: "音频版本", value: siteAudioReadyLabel(site) },
          { label: "融合方式", value: siteSourceCount(site) > 1 ? "先文字和资料融合" : "先按单源可用版发布" },
          { label: "当前策略", value: siteSourceCount(site) > 1 ? "音频先保来源，资料页先融合" : "先把单源讲解做成可用版" }
        ];
      }

      if (type === "source-map") {
        return [
          { label: "当前页", value: "章节融合页" },
          { label: "音频版本", value: "主讲净化版自动播放" },
          { label: "融合方式", value: "先保顺听，再补细节" },
          { label: "这一页角色", value: "把主讲和补充各自分工讲明白" }
        ];
      }

      if (!chapter && site) {
        const overviewEntry = site?.overview?.facts?.[0]?.value || site?.overview?.highlights?.[0] || "先总览后进章节";
        return [
          { label: "内容点", value: `${(site?.chapters || []).length} 段` },
          { label: "音频版本", value: siteAudioReadyLabel(site) },
          { label: "当前页", value: type === "workflow" ? "发布策略" : type === "shots" ? "建议顺序" : type === "image" ? "主视觉" : "核心抓手" },
          { label: "建议入口", value: overviewEntry }
        ];
      }

      const focusItems = getSlideFocusItems(type, rowsOrBullets, chapter, site)
        .map(normalizeSlideFocusItem)
        .slice(0, 2);
      const facts = [
        { label: "音频区间", value: chapter?.time || "待接入" },
        { label: "时长", value: chapter?.duration || "待接入" },
        { label: "音频版本", value: "净化版已就绪" },
        { label: chapter?.sourceLabel ? "素材源" : "本页焦点", value: chapter?.sourceLabel || focusItems[0] || chapter?.title || site?.name || "本页主线" }
      ];

      return facts;
    }

    function buildSlideNote(type, rowsOrBullets, chapter, site, meta = {}) {
      if (type === "spotlight" && Array.isArray(rowsOrBullets?.steps) && rowsOrBullets.steps.length === 1 && meta.compact !== false) {
        return null;
      }

      if (meta.note) {
        return {
          label: meta.noteLabel || "补充说明",
          text: meta.note
        };
      }

      if (type === "sources") {
        return {
          label: "融合方式",
          text: `${rowsOrBullets?.note || site?.overview?.fusion || "后续新增资料优先带来源标注并入对应章节，再决定是否重做整段音频。"} 本景点音频已全部切成净化版，可直接用于当前网页讲解。`
        };
      }

      if (type === "source-map") {
        return {
          label: "当前策略",
          text: "多来源章节默认先保住当前能顺听的主讲音频，再把补充来源按主题并到资料页；只有主线判断被改写时，才进入重录。"
        };
      }

      if (chapter) {
        return {
          label: "本段主线",
          text: chapter.summary || "这一段会围绕当前章节展开补充讲解。"
        };
      }

      return {
        label: "到场前先记住",
        text: site?.overview?.note || "先把主线和重点问题装进脑子，现场会更顺。"
      };
    }

    function renderSlideSupport(type, rowsOrBullets, chapter, site, meta = {}) {
      const facts = buildSlideFacts(type, rowsOrBullets, chapter, site, meta);
      slideFacts.innerHTML = facts.map(item => `
        <div class="slide-fact">
          <span>${escapeHtml(polishVisibleText(item.label))}</span>
          <strong>${displayText(item.value)}</strong>
        </div>
      `).join("");

      const note = buildSlideNote(type, rowsOrBullets, chapter, site, meta);
      slideNote.innerHTML = note?.text
        ? `<span>${escapeHtml(polishVisibleText(note.label))}</span><p>${displayText(note.text)}</p>`
        : "";
    }

    function updateSlideCopyLayout({ chapter = null, bodyText = "" } = {}) {
      const hasSupport = Boolean(slideFacts.childElementCount || slideBullets.childElementCount || slideNote.childElementCount);
      const hideNarration = Boolean(chapter && bodyText && hasSupport);
      slideText.hidden = hideNarration;
      slideText.textContent = hideNarration ? "" : bodyText;
      slideCopy.dataset.layout = hideNarration ? "brief" : "full";
    }

    function normalizeChapterIndex(index, total) {
      const span = total + 1;
      return ((((index + 1) % span) + span) % span) - 1;
    }

    function renderPlaceList() {
      placeList.innerHTML = "";
      sites.forEach((site, index) => {
        const button = document.createElement("button");
        const hasChapters = Boolean((site.chapters || []).length);
        button.className = [
          "place",
          index === activeSite ? "active" : "",
          hasChapters ? "" : "pending"
        ].filter(Boolean).join(" ");
        button.type = "button";
        button.dataset.siteId = site.id;
        button.innerHTML = `<span>${site.name}</span><small>${siteStatus(site)}</small>`;
        button.addEventListener("click", () => setPlace(index));
        placeList.appendChild(button);
      });
    }

    function renderChapterList() {
      chapterList.innerHTML = "";
      const chapters = currentChapters();
      if (!chapters.length) {
        chapterList.innerHTML = `
          <div class="empty-state">
            素材待接入
            <span>下载音频、转写并拆分后，章节会出现在这里。</span>
          </div>
        `;
        return;
      }

      const overviewButton = document.createElement("button");
      overviewButton.className = "chapter-button overview" + (activeChapter === -1 ? " active" : "");
      overviewButton.type = "button";
      overviewButton.dataset.chapterId = `${currentSite().id}-overview`;
      overviewButton.innerHTML = `
        <span class="chapter-index">览</span>
        <span>
          <span class="chapter-name">景点总览</span>
          <span class="chapter-meta">
            <span class="chapter-time">${siteSourceLabel(currentSite())}</span>
            <span class="chapter-source">先看路线</span>
          </span>
        </span>
      `;
      overviewButton.addEventListener("click", () => setChapter(-1, false));
      chapterList.appendChild(overviewButton);

      chapters.forEach((chapter, index) => {
        const fusionMeta = getChapterFusionMeta(currentSite(), chapter);
        const button = document.createElement("button");
        button.className = "chapter-button" + (index === activeChapter ? " active" : "");
        button.type = "button";
        button.dataset.chapterId = chapter.id;
        button.innerHTML = `
          <span class="chapter-index">${twoDigit(index)}</span>
          <span>
            <span class="chapter-name">${chapter.title}</span>
            <span class="chapter-meta">
              <span class="chapter-time">${chapter.time}</span>
              ${chapter.sourceLabel ? `<span class="chapter-source">${chapter.sourceLabel}</span>` : ""}
              ${fusionMeta.tone !== "single" ? `<span class="chapter-source" data-tone="${escapeHtml(fusionMeta.tone)}">${escapeHtml(fusionMeta.railLabel)}</span>` : ""}
            </span>
          </span>
        `;
        button.addEventListener("click", () => setChapter(index, true));
        chapterList.appendChild(button);
      });
    }

    function getSiteSlides(site) {
      const overview = site.overview || {};
      const slides = [
        [
          "site-overview",
          site.name,
          overview.summary || "这里会放景点总览、参观主线和重点内容。",
          {
            kicker: "景点总览",
            facts: overview.facts || [],
            route: overview.route || [],
            bullets: overview.highlights || [],
            note: overview.note || ""
          }
        ],
      ];

      if ((overview.sources || []).length) {
        slides.push([
          "sources",
          (overview.sources || []).length > 1 ? "素材源与融合方式" : "本景点素材源",
          overview.fusion || "当前先按单一主素材切段，后续补充资料会带着来源标签并入对应章节。",
          {
            items: overview.sources || [],
            workflow: overview.workflow || [],
            note: overview.fusion || ((overview.sources || []).length > 1
              ? "当前网页先用“来源标记 + 主题重组”的方式融合多条讲解，不急着整体重录，先把现场可用性做实。"
              : "当前先按单一主素材切段，后续新增资料会优先补到原章节资料页，再决定是否重做整段音频。")
          }
        ]);
      }

      slides.push(buildSiteWorkflowSlide(site));

      slides.push(
        [
          "diagram",
          "这座古迹最值得盯住的三件事",
          "先把这三件事放在心里，再去点各章节，现场会更容易把信息接住。",
          overview.highlights || []
        ],
        [
          "shots",
          "建议怎么听",
          "先看这一页，再按你最关心的内容去点章节，网页端就会更像随身讲解台。",
          overview.route || []
        ],
        [
          "image",
          site.name,
          site.imageCaption,
          site.image
        ]
      );

      return slides;
    }

    function getSlides(chapter) {
      const sourceMapSlide = buildChapterSourceMapSlide(chapter, currentSite());
      const verifySlide = chapter.verifySlide || buildChapterVerifySlide(chapter, currentSite());
      const rawShotSlide = chapter.shotSlide || buildDefaultShotSlide(chapter);
      // 让 shots 页强制使用第 2 张 override 图（与 archive 和 verify 形成三图轮换）
      const overrides = chapterReferenceOverrides[chapter.id] || [];
      const shotForceSrc = overrides[1]?.src || null;
      const shotSlide = shotForceSrc
        ? [...rawShotSlide.slice(0, 4), { ...(rawShotSlide[4] || {}), forceSrc: shotForceSrc }]
        : rawShotSlide;
      const slides = [...chapter.slides];
      if (sourceMapSlide) {
        slides.splice(Math.min(1, slides.length), 0, sourceMapSlide);
      }
      return [...slides, verifySlide, shotSlide];
    }

    function currentVisualBackdrop() {
      const chapter = currentChapter();
      const site = currentSite();
      if (chapter && site) {
        const selected = selectBestVisualMediaItem(
          "backdrop",
          chapter.title,
          chapter.summary || "",
          chapter.shots || [],
          {},
          site,
          chapter
        );
        if (selected?.src) {
          return {
            src: selected.src,
            alt: selected.alt || `${site?.name || "景点"} · ${chapter.title}`
          };
        }
      }
      return {
        src: chapter?.image || site?.image || "",
        alt: chapter ? `${site?.name || "景点"} · ${chapter.title}` : (site?.imageAlt || `${site?.name || "景点"}主图`)
      };
    }

    function renderVisualStage(contentHtml, options = {}) {
      const backdrop = currentVisualBackdrop();
      const imageSrc = options.imageSrc || backdrop.src;
      const imageAlt = options.imageAlt || backdrop.alt;

      if (!imageSrc) {
        return `${contentHtml}<div class="floating-hint">左右滑动翻页</div>`;
      }

      return `
        <div class="visual-stage visual-stage--${options.variant || "default"}">
          <img class="stage-backdrop" src="${escapeHtml(imageSrc)}" alt="${escapeHtml(imageAlt)}">
          <div class="visual-stage-panel">
            ${contentHtml}
          </div>
        </div>
        <div class="floating-hint">左右滑动翻页</div>
      `;
    }

    function renderPureImageStage(item = {}) {
      const src = item.src || currentVisualBackdrop().src || "";
      const alt = item.alt || currentVisualBackdrop().alt || "资料图";
      if (!src) {
        return `
          <div class="pure-image-stage" role="img" aria-label="${escapeHtml(alt)}"></div>
        `;
      }

      return `
        <div class="pure-image-stage">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}">
        </div>
      `;
    }

    function buildImageGalleryItems(site, chapter, imageSrc, imageAlt, imageCaption = "") {
      const items = [];
      const seen = new Set();
      const chapters = site?.chapters || [];
      const chapterIndex = chapter ? chapters.findIndex(item => item.id === chapter.id) : -1;
      const chapterRefs = chapter ? (chapterReferenceOverrides[chapter.id] || []) : [];

      const pushItem = (src, alt, chip, title, caption = "", extra = {}) => {
        if (!src || seen.has(src)) {
          return;
        }
        seen.add(src);
        items.push(enrichReferenceItem({ ...extra, src, alt, chip, title, caption }));
      };

      chapterRefs.forEach((item, index) => {
        pushItem(
          item.src,
          item.alt || `${chapter.title}参考图`,
          index === 0 ? "参考主图" : `参考 ${String(index + 1).padStart(2, "0")}`,
          item.title || chapter.title,
          item.caption || chapter.summary || imageCaption || "",
          item
        );
      });

      getSiteReferenceImages(site).forEach((item, index) => {
        pushItem(
          item.src,
          item.alt || `${site?.name || "景点"}参考图`,
          `图库 ${String(index + 1).padStart(2, "0")}`,
          item.title || site?.name || "参考图",
          item.caption || site?.imageCaption || "",
          item
        );
      });

      pushItem(
        imageSrc,
        imageAlt,
        chapterRefs.length ? "本章原图" : (chapter ? "本章主图" : "景点主图"),
        chapter?.title || site?.name || "主图",
        imageCaption || site?.imageCaption || ""
      );

      if (chapter) {
        pushItem(
          site?.image,
          site?.imageAlt || `${site?.name || "景点"}总览`,
          "景点总图",
          site?.name || "景点总览",
          site?.imageCaption || ""
        );

        const previousChapter = chapterIndex > 0 ? chapters[chapterIndex - 1] : null;
        const nextChapter = chapterIndex >= 0 && chapterIndex < chapters.length - 1 ? chapters[chapterIndex + 1] : null;

        if (previousChapter) {
          pushItem(
            previousChapter.image || chapterImagePath(previousChapter.id),
            `${site?.name || "景点"} · ${previousChapter.title}`,
            "上一内容",
            previousChapter.title,
            previousChapter.summary || ""
          );
        }

        if (nextChapter) {
          pushItem(
            nextChapter.image || chapterImagePath(nextChapter.id),
            `${site?.name || "景点"} · ${nextChapter.title}`,
            "下一内容",
            nextChapter.title,
            nextChapter.summary || ""
          );
        }
      } else {
        (chapters || []).slice(0, 2).forEach((item, index) => {
          pushItem(
            item.image || chapterImagePath(item.id),
            `${site?.name || "景点"} · ${item.title}`,
            `章节 ${String(index + 1).padStart(2, "0")}`,
            item.title,
            item.summary || ""
          );
        });
      }

      return items.slice(0, 4);
    }

    function getStageMediaItems(site, chapter, fallbackTitle = "", fallbackText = "", count = 3) {
      const imageSrc = chapter?.image || site?.image || "";
      const imageAlt = chapter
        ? `${site?.name || "景点"} · ${chapter.title}`
        : (site?.imageAlt || `${site?.name || "景点"}资料图`);
      const imageCaption = chapter?.summary || site?.imageCaption || fallbackText || "";
      const items = buildImageGalleryItems(site, chapter, imageSrc, imageAlt, imageCaption).slice(0, count);

      if (items.length) {
        return items;
      }

      if (!imageSrc) {
        return [];
      }

      return [{
        src: imageSrc,
        alt: imageAlt,
        chip: chapter ? "本章主图" : "景点主图",
        title: chapter?.title || site?.name || fallbackTitle || "主图",
        caption: imageCaption || fallbackText || ""
      }];
    }

    function getPureVisualMediaItem(type, title, text, rowsOrBullets, meta = {}, site, chapter) {
      if (meta.forceSrc) {
        return {
          src: meta.forceSrc,
          alt: meta.forceSrcAlt || (chapter ? `${site?.name || "景点"} · ${chapter.title}` : title || "资料图")
        };
      }
      if (type === "spotlight") {
        const step = Array.isArray(rowsOrBullets?.steps) ? rowsOrBullets.steps[0] : null;
        if (step?.src && !isRawChapterFrame(step.src)) {
          return {
            src: step.src,
            alt: step.alt || step.title || title || "知识点资料图"
          };
        }
      }

      if (type === "image") {
        return selectBestVisualMediaItem(type, title, text, rowsOrBullets, meta, site, chapter);
      }

      const mediaItem = selectBestVisualMediaItem(type, title, text, rowsOrBullets, meta, site, chapter)
        || getStageMediaItems(site, chapter, title, text, 1)[0];
      if (mediaItem?.src) {
        return mediaItem;
      }

      return {
        src: chapter?.image || site?.image || meta.imageSrc || "",
        alt: chapter ? `${site?.name || "景点"} · ${chapter.title}` : (site?.imageAlt || title || "资料图")
      };
    }

    function shouldUsePureImageStage(type, chapter) {
      if (!chapter) {
        return false;
      }
      return ["archive", "image", "diagram", "spotlight", "shots", "verify", "workflow"].includes(type);
    }

    function sourceMatchesChapter(site, chapter, label) {
      const target = compactSourceLabel(label);
      if (!target || !chapter) {
        return false;
      }

      if (compactSourceLabel(chapter.sourceLabel) === target) {
        return true;
      }

      const profile = chapterSourceProfile(site, chapter);
      if (compactSourceLabel(profile.primary) === target) {
        return true;
      }

      return (profile.supporting || []).some(item => compactSourceLabel(item) === target);
    }

    function getSourceCardModel(site, sourceItem, index = 0) {
      const chapters = (site?.chapters || []).filter(chapter => sourceMatchesChapter(site, chapter, sourceItem.label));
      const stats = sourceRoleStats(site, sourceItem);
      const representative = chapters[0] || site?.chapters?.[0] || null;
      const imageSrc = representative?.image || site?.image || "";
      const imageAlt = representative
        ? `${site?.name || "景点"} · ${representative.title}`
        : (site?.imageAlt || `${site?.name || "景点"}来源图`);
      const relationshipLabel = stats.primaryCount && stats.supportingCount
        ? "主讲 + 补充"
        : stats.primaryCount
          ? (index === 0 ? "当前主讲" : "章节主讲")
          : stats.supportingCount
            ? "章节补充"
            : (index === 0 ? "当前入口" : "补充入口");

      return {
        imageSrc,
        imageAlt,
        imageChip: relationshipLabel,
        imageTitle: representative?.title || sourceItem.label,
        imageCaption: representative?.summary || sourceItem.coverage || site?.imageCaption || "",
        linkedCount: chapters.length,
        linkedLabel: chapters.length ? `${chapters.length} 个内容点已挂载` : "当前以资料页补入",
        roleLabel: sourceItem.role || (index === 0 ? "当前主素材" : "补充来源"),
        primaryCount: stats.primaryCount,
        supportingCount: stats.supportingCount
      };
    }

    function getOverviewPreviewChapters(site) {
      const chapters = site?.chapters || [];
      const picks = site?.overview?.previewIds || site?.overview?.previewIndices || [];

      if (Array.isArray(picks) && picks.length) {
        const resolved = picks.map(item => {
          if (typeof item === "number") {
            return chapters[item] || null;
          }
          if (typeof item === "string") {
            return chapters.find(chapter => chapter.id === item) || null;
          }
          return null;
        }).filter(Boolean);

        if (resolved.length) {
          return resolved.slice(0, 3);
        }
      }

      return chapters.slice(0, 3);
    }

    function getOverviewRouteTargets(site, previewChapters = []) {
      const chapters = site?.chapters || [];
      const explicit = site?.overview?.routeChapterIds || site?.overview?.routeChapterIndices || [];

      if (Array.isArray(explicit) && explicit.length) {
        return explicit.map(item => {
          if (typeof item === "number") {
            return chapters[item] || null;
          }
          if (typeof item === "string") {
            return chapters.find(chapter => chapter.id === item) || null;
          }
          return null;
        }).filter(Boolean);
      }

      if (previewChapters.length) {
        return previewChapters;
      }

      return chapters.slice(0, 3);
    }

    function bindOverviewLaunchTargets(scope = slideVisual) {
      [...scope.querySelectorAll("[data-chapter-index]")].forEach(card => {
        card.addEventListener("click", () => {
          const chapterIndex = Number(card.dataset.chapterIndex || "-1");
          if (Number.isFinite(chapterIndex) && chapterIndex >= 0) {
            setChapter(chapterIndex, true);
          }
        });
      });
    }

    function applyGalleryCard(card, item) {
      if (!card || !item) {
        return;
      }

      card.dataset.src = item.src || "";
      card.dataset.alt = item.alt || "";
      card.dataset.chip = item.chip || "";
      card.dataset.title = item.title || "";
      card.dataset.caption = item.caption || "";

      const image = card.querySelector("img");
      const chip = card.querySelector(".image-chip");
      const title = card.querySelector(".image-card-caption strong");
      const caption = card.querySelector(".image-card-caption span:last-child");

      if (image) {
        image.src = item.src || "";
        image.alt = item.alt || "";
      }
      if (chip) {
        chip.textContent = item.chip || "";
      }
      if (title) {
        title.textContent = item.title || "";
      }
      if (caption) {
        caption.textContent = item.caption || "";
      }
    }

    function readGalleryCard(card) {
      if (!card) {
        return null;
      }

      return {
        src: card.dataset.src || "",
        alt: card.dataset.alt || "",
        chip: card.dataset.chip || "",
        title: card.dataset.title || "",
        caption: card.dataset.caption || ""
      };
    }

    function wireImageGalleryInteractions() {
      const boards = [...slideVisual.querySelectorAll(".image-stage-board, .archive-stage-media")];
      if (!boards.length) {
        return;
      }

      boards.forEach(board => {
        const mainCard = board.querySelector(".image-main-card");
        const sideCards = [...board.querySelectorAll(".image-side-card")];
        if (!mainCard || !sideCards.length) {
          return;
        }

        sideCards.forEach(card => {
          const swapWithMain = () => {
            const mainData = readGalleryCard(mainCard);
            const sideData = readGalleryCard(card);
            if (!mainData || !sideData) {
              return;
            }
            applyGalleryCard(mainCard, sideData);
            applyGalleryCard(card, mainData);
          };

          card.addEventListener("click", swapWithMain);
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              swapWithMain();
            }
          });
        });
      });
    }

    function readSpotlightStep(button) {
      if (!button) {
        return null;
      }

      return {
        src: button.dataset.src || "",
        alt: button.dataset.alt || "",
        chip: button.dataset.chip || "",
        title: button.dataset.title || "",
        caption: button.dataset.caption || ""
      };
    }

    function wireSpotlightInteractions() {
      const boards = [...slideVisual.querySelectorAll(".spotlight-stage-board")];
      if (!boards.length) {
        return;
      }

      boards.forEach(board => {
        const heroCard = board.querySelector(".spotlight-stage-hero");
        const steps = [...board.querySelectorAll(".spotlight-stage-step")];
        if (!heroCard || !steps.length) {
          return;
        }

        const activateStep = (button) => {
          const step = readSpotlightStep(button);
          if (!step?.src) {
            return;
          }

          applyGalleryCard(heroCard, step);
          steps.forEach(item => {
            item.classList.toggle("is-active", item === button);
            item.setAttribute("aria-pressed", item === button ? "true" : "false");
          });
        };

        steps.forEach(button => {
          button.addEventListener("click", () => activateStep(button));
          button.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              activateStep(button);
            }
          });
        });

        activateStep(steps.find(step => step.classList.contains("is-active")) || steps[0]);
      });
    }

    function diagramStageLabel(index) {
      return ["第一抓手", "第二抓手", "第三抓手"][index] || `第 ${index + 1} 抓手`;
    }

    function shotsStageStatus(index, total) {
      if (index === 0) return "先看";
      if (index === 1) return "再看";
      if (index === total - 1) return "收束";
      if (index < 3) return "展开";
      return "延展";
    }

    function shotsStageHint(index, total) {
      if (index === 0) return "先把入口问题和观看顺序立起来。";
      if (index === 1) return "接着补结构、人物或主殿细节。";
      if (index === total - 1) return "最后把这一章的情绪或判断收住。";
      return "作为现场补看或回听加深页。";
    }

    function chapterSourceProfile(site, chapter) {
      const overviewSources = site?.overview?.sources || [];
      const siteFusion = chapterFusionSourcesBySite[site?.id]?.[chapter.id];

      if (siteFusion) {
        return {
          primary: siteFusion.primary,
          supporting: siteFusion.supporting || [],
          multiSourceSite: overviewSources.length > 1
        };
      }

      if (overviewSources.length > 1) {
        const primarySource = overviewSources.find(item => item.label === chapter.sourceLabel) || overviewSources[0];
        return {
          primary: primarySource?.label ? `${primarySource.label} · 当前主讲` : `${chapter.sourceLabel || site?.name || "当前景点"} · 当前主讲`,
          supporting: overviewSources
            .filter(item => item !== primarySource)
            .map(item => `${item.label} · 待按章节并入`),
          multiSourceSite: true
        };
      }

      return {
        primary: chapter.sourceLabel ? `${chapter.sourceLabel} · 当前主讲` : (site?.sourceTitle || `${site?.name || "当前景点"}主讲`),
        supporting: [],
        multiSourceSite: false
      };
    }

    function parseSourceDescriptor(value) {
      const [label, detail] = String(value || "").split(" · ");
      return {
        label: compactSourceLabel(label),
        detail: normalizeSlideFocusItem(detail || "")
      };
    }

    function buildChapterSourceMapSlide(chapter, site) {
      const breakdown = getChapterFusionBreakdown(site, chapter);
      const { primaryInfo, supportInfos } = breakdown;

      if (!breakdown.hasAnySupplement) {
        return null;
      }

      const focusItems = (chapter?.shots || []).map(normalizeSlideFocusItem).filter(Boolean);
      const firstFocus = focusItems[0] || normalizeSlideFocusItem(chapter?.title || "这一章主线");
      const secondFocus = focusItems[1] || firstFocus;
      const thirdFocus = focusItems[2] || secondFocus;
      const primaryGroup = {
        tone: "primary",
        role: "当前主讲",
        source: primaryInfo.label || compactSourceLabel(chapter?.sourceLabel || site?.name || "当前景点"),
        summary: primaryInfo.detail || `这段音频主要讲 ${firstFocus}，是这章最完整的一条主线。`,
        items: [
          `先把 ${firstFocus} 当成这章的顺听入口。`,
          `这章主线聚焦在 ${secondFocus} 上。`,
          `这段音频是这一章最完整的讲解版本。`
        ]
      };

      const supportGroupMap = new Map();
      supportInfos.forEach((item, index) => {
        const isSameSource = item.label && item.label === primaryGroup.source;
        const key = `${isSameSource ? "same" : "other"}:${item.label || index}`;
        if (!supportGroupMap.has(key)) {
          supportGroupMap.set(key, {
            tone: "support",
            role: isSameSource ? (item.pending ? "同源待并入" : "同源补段") : (item.pending ? "待并入" : "同章补充"),
            source: item.label || compactSourceLabel(item.descriptor),
            pending: item.pending,
            sameSource: isSameSource,
            details: []
          });
        }

        const group = supportGroupMap.get(key);
        if (item.detail) {
          group.details.push(item.detail);
        }
      });

      const supportGroups = [...supportGroupMap.values()];
      const supportingGroups = supportGroups.map((group, index) => {
        const laneFocus = index === 0 ? secondFocus : thirdFocus;
        const detailItems = [...new Set(group.details.filter(Boolean))];
        return {
          tone: "support",
          role: group.role,
          source: group.source,
          summary: group.sameSource
            ? `${group.source} 这条主讲里还有 ${Math.max(1, detailItems.length)} 段同源补位，先并进资料页。`
            : (detailItems[0] || `${group.source} 更适合先补 ${laneFocus} 这条线。`),
          items: detailItems.length
            ? detailItems.map((detail, detailIndex) => `${detailIndex === 0 ? (group.sameSource ? "先补" : "优先补") : "再补"} ${detail}`)
            : group.pending
              ? [
                  `先把 ${laneFocus} 的补充信息挂到资料页，不急着改音频。`,
                  "等来源核对和图片补齐后，再决定是否升级成并章主线。"
                ]
              : [
                  `优先补 ${laneFocus} 相关的局部图、争议点或编号说明。`,
                  "如果它只是把理解讲得更深，先继续长在资料页里。"
                ]
        };
      });

      const sameSourceOnly = breakdown.uniqueSourceCount <= 1;
      const structureLabel = sameSourceOnly
        ? `${breakdown.descriptorCount} 段同源并章`
        : `${breakdown.uniqueSourceCount} 源 / ${breakdown.descriptorCount} 段`;
      const sourceMapTitle = sameSourceOnly
        ? "这章不是来了新来源，而是同一条讲解里的前后几段在一起服务这一页"
        : "这章不是把来源堆在一起，而是先分清谁负责顺听、谁负责补深";
      const sourceMapText = sameSourceOnly
        ? `这章当前仍以 ${primaryGroup.source} 这条主讲为骨架，另外几段同源内容先并进资料页，专门补 ${secondFocus} 和 ${thirdFocus} 这些更适合回看加深的细节。`
        : `同一景点有多条讲解时，最重要的不是马上并稿，而是先让 ${primaryGroup.source} 稳住主线，再让补充来源把 ${secondFocus} 和 ${thirdFocus} 这些细节补深。`;
      const cards = [
        { label: "当前主讲", value: primaryGroup.source },
        { label: "并章结构", value: structureLabel },
        { label: "优先守住", value: firstFocus },
        { label: "当前策略", value: sameSourceOnly ? "同源多段先并章，不急着改音频" : "先保顺听，再按来源补深" }
      ];

      return [
        "source-map",
        sourceMapTitle,
        sourceMapText,
        {
          kicker: sameSourceOnly ? "并章 / 对位页" : "融合 / 对位页",
          cards,
          groups: [primaryGroup, ...supportingGroups]
        },
        {
          facts: [
            { label: "来源构成", value: structureLabel },
            { label: "主讲来源", value: primaryGroup.source },
            { label: "章节聚焦", value: `${secondFocus} / ${thirdFocus}` },
            { label: "内容完整度", value: sameSourceOnly ? "单来源多段" : "多来源已融合" }
          ],
          bullets: [
            `${primaryGroup.source} 负责这章主线顺听。`,
            sameSourceOnly
              ? `同一来源的其他段落把 ${secondFocus} 和 ${thirdFocus} 这些细节补深。`
              : `${[...new Set(supportingGroups.map(item => item.source))].join(" / ")} 把细节和补充信息并入同章。`,
            "多来源内容并入同章后，主线讲解和细节补充分工清晰。"
          ],
          noteLabel: "内容说明",
          note: sameSourceOnly
            ? "同一来源的多段内容合并到本章，覆盖范围更完整。"
            : "补充来源已并入本章资料页，主讲音频保持完整不间断。"
        }
      ];
    }

    function buildChapterVerifySlide(chapter, site) {
      const firstFocus = normalizeSlideFocusItem(chapter.shots?.[0] || chapter.title);
      const secondFocus = normalizeSlideFocusItem(chapter.shots?.[1] || firstFocus);
      const thirdFocus = normalizeSlideFocusItem(chapter.shots?.[2] || secondFocus);

      // 强制使用第 2 或第 3 张 override 图，让”要点页”与档案页图不重复
      const overrides = chapterReferenceOverrides[chapter.id] || [];
      const verifyForceSrc = overrides[2]?.src || overrides[1]?.src || null;

      const cards = [
        { label: "先找", value: firstFocus },
        { label: "再认", value: secondFocus },
        { label: "细看", value: thirdFocus },
        { label: "这章主线", value: chapter.title }
      ];

      const steps = [
        `到现场先找到${firstFocus}，这是这章最重要的观察对象。`,
        `找到之后，再把${secondFocus}和刚才听到的内容逐一对上。`,
        `最后把${thirdFocus}仔细看一遍，让这章内容在现场真正落实。`
      ];

      const checks = [
        `${firstFocus}——找到了吗？`,
        `${secondFocus}——和音频说的对上了吗？`,
        `整章主线——能用一句话说出来吗？`
      ];

      const verifyMeta = {
        facts: [
          { label: "音频区间", value: chapter.time },
          { label: "先找", value: firstFocus },
          { label: "再认", value: secondFocus },
          { label: "细看", value: thirdFocus }
        ],
        noteLabel: "现场提示",
        note: `先把${firstFocus}找到，再把${secondFocus}和音频逻辑连起来，这章就真正进脑子了。`,
        ...(verifyForceSrc ? { forceSrc: verifyForceSrc } : {})
      };

      return [
        "verify",
        "现场抓住这三处",
        chapter.summary
          ? chapter.summary
          : `听完这章，到现场把${firstFocus}、${secondFocus}和${thirdFocus}依次找到，音频里的内容会自然在眼前对位。`,
        { kicker: "现场手册", cards, steps, checks },
        verifyMeta
      ];
    }

    function buildSiteWorkflowSlide(site) {
      const overview = site?.overview || {};
      const sources = overview.sources || [];
      const multiSource = siteSourceCount(site) > 1;
      const steps = overview.workflow?.length
        ? overview.workflow
        : (multiSource
          ? [

              "再用来源标签和主题重组，把新增细节挂到对应章节下。",
              "只有当某章主线被改写时，才值得并稿和重录。"
            ]
          : [
              "先把单源主讲切成稳定章节，确保现场可直接点着听。",
              "再把补图、局部图、结构图和补充考据优先长在资料页里。",
              "只有当新增资料明显改写章节结构时，才考虑重录。"
            ]);
      const checks = multiSource
        ? [
            "资料页先承担融合工作，音频不抢先整站并稿。",
            "新增链接先拆成“改写主线”和”补深细节”两层。",
            "只有前者明确成立，才值得进入重录流程。"

        : [

            "新增资料优先补图、补说明和补考据，不急着改音频。",
            "只有章节主线被改写时，才值得进入重录流程。"
          ];

      return [
        "workflow",
        multiSource ? "这座古迹先按章节融合，不急着整站重录" : "这座古迹先把单源版本做深",
        multiSource
          ? "同景点多来源最稳妥的方式，是先让资料页吸收新增来源，再决定哪些章节真的值得进入并稿和重录。"
          : "单一主素材阶段，最值钱的工作不是提前重录，而是先把每章的图文补强、考据补深和挂载结构做好。",
        {
          kicker: multiSource ? "融合 / 发布页" : "单源 / 发布页",
          cards: [
            { label: "来源格局", value: multiSource ? `${siteSourceLabel(site)} 并行` : "单一主素材" },
            { label: "当前发布", value: multiSource ? "资料页先融合 / 音频先保来源" : "单源先上线 / 资料页先补深" },
            { label: "音频状态", value: siteAudioReadyLabel(site) },
            { label: "重录条件", value: multiSource ? "只有章节主线被改写" : "只有章节结构被改写" }
          ],
          steps,
          checks
        },
        {
          facts: [

            { label: "当前节奏", value: multiSource ? "章节先融合 / 不急着重录" : "单源先发布 / 资料页补强" },
            { label: "音频准备", value: siteAudioReadyLabel(site) },
            { label: "这一页角色", value: multiSource ? "先定融合边界和重录条件" : "先定补图顺序和扩展方式" }
          ],
          noteLabel: multiSource ? "融合总则" : "当前策略",
          note: overview.fusion || (multiSource
            ? "新增资料默认先带来源标签并进章节资料页，等叙事闭环足够明显时，再考虑并稿和重录。"
            : "当前先把单源讲解做成可直接使用的版本，新增资料优先补到原章节里，再决定是否动音频。")
        }
      ];
    }

    function resetSlideGesture() {
      touchStartX = null;
      touchStartY = null;
    }

    function beginSlideGesture(x, y) {
      touchStartX = x;
      touchStartY = y;
    }

    function endSlideGesture(x, y) {
      if (touchStartX === null || touchStartY === null) return;
      const dx = x - touchStartX;
      const dy = y - touchStartY;
      resetSlideGesture();

      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (dx < 0) {
        nextSlide();
      } else {
        prevSlide();
      }
    }

            ` : ""}
          </div>
        `, { variant: "archive" });
        wireImageGalleryInteractions();
        return;
      }

      slideVisual.innerHTML = `
        <div class="diagram" role="img" aria-label="${title}">
          <div class="diagram-line"></div>
        </div>
        <div class="floating-hint">左右滑动翻页</div>
      `;
    }

    function getSlideBullets(type, rowsOrBullets, chapter, site, meta = {}) {
      if (type === "spotlight" && Array.isArray(rowsOrBullets?.steps) && rowsOrBullets.steps.length === 1 && meta.compact !== false) {
        return [];
      }

      if (Array.isArray(meta.bullets) && meta.bullets.length) {
        return meta.bullets.map(normalizeSlideFocusItem);
      }

      if (type === "site-overview") {
        return rowsOrBullets?.bullets || site?.overview?.highlights || [];
      }

      if (type === "sources") {
        const workflow = rowsOrBullets?.workflow || [];
        if (workflow.length) {
          return workflow.map(normalizeSlideFocusItem);
        }
        return (rowsOrBullets?.items || [])
          .map(item => `${item.label}：${item.role}`)
          .map(normalizeSlideFocusItem);
      }

      if (type === "workflow" || type === "verify") {
        return (rowsOrBullets?.checks || rowsOrBullets?.steps || []).map(normalizeSlideFocusItem);
      }

      return buildAutoSlideBullets(type, rowsOrBullets, chapter, site).map(normalizeSlideFocusItem);
    }

    function showAudioPlaceholder(message) {
      audioPlayer.pause();
      audioPlayer.removeAttribute("src");
      audioPlayer.load();
      delete audioPlayer.dataset.loadedStateLabel;
      playerControls.hidden = true;
      audioPlaceholder.hidden = false;
      audioPlaceholder.textContent = message;
      currentTimeLabel.textContent = "0:00";
      durationLabel.textContent = "0:00";
      seekBar.value = "0";
      renderPlayPauseIcon(false);
      setPlayerState(message.includes("等待") ? "等待素材" : "待播放");
      setAudioModeBadge(null);
      chapterFusionBadge.hidden = true;
      chapterFusionBadge.textContent = "";
      chapterFusionBadge.removeAttribute("data-tone");
    }

    function showAudioPlayer(src, mode = "enhanced", loadedStateLabel = "") {
      audioPlaceholder.hidden = true;
      playerControls.hidden = false;
      const readyLabel = loadedStateLabel || (mode === "original" ? "原始音频已载入" : "净化音频已载入");
      audioPlayer.dataset.loadedStateLabel = readyLabel;
      setPlayerState(mode === "original" ? "原始音频加载中" : "净化音频加载中");
      setAudioModeBadge(mode);
      if (audioPlayer.getAttribute("src") !== src) {
        audioPlayer.src = src;
      }
      syncPlayerUi();
    }

    function loadChapterAudio(chapter, shouldPlay = false) {
      const { enhanced, original } = audioSourcesForChapter(chapter);
      audioPlayer.dataset.primarySrc = enhanced;
      audioPlayer.dataset.fallbackSrc = original;
      audioPlayer.dataset.shouldAutoplay = shouldPlay ? "1" : "0";
      showAudioPlayer(enhanced, "enhanced");
    }

    function renderEmptySite(site) {
      setUiMode("empty");
      slideCard.dataset.slideType = "empty";
      updatePlayerVisual(site, null);
      chapterNumber.textContent = "--";
      chapterTime.textContent = siteStatus(site);
      chapterDuration.textContent = "等待素材";
      chapterTitle.textContent = `${site.name} · 素材待接入`;
      sourceLink.textContent = "素材待接入";
      sourceLink.removeAttribute("href");
      renderSourceStack(site, null);
      showAudioPlaceholder("等待素材接入");

      renderChapterList();
      slideDeckTitle.textContent = `${site.name} · 待接入`;
      slideCounter.textContent = "0 / 0";
      slideTitle.textContent = site.name;
      slideFacts.innerHTML = "";
      slideBullets.innerHTML = (site.todo || []).map(item => `<li>${item}</li>`).join("");
      slideNote.innerHTML = `<span>当前状态</span><p>这个景点的播放器、资料页和章节结构已经预留好，等素材接入后就能沿用同一套交互界面。</p>`;
      updateSlideCopyLayout({
        chapter: null,
        bodyText: "这里会成为下一批导览内容的资料页：音频切段、参考图片和现场观察会按同一套交互接进来。"
      });
      slideKicker.innerHTML = `<span class="chip">${site.status}</span><span>下一批处理</span>`;
      slideDots.innerHTML = "";
      slideVisual.innerHTML = `
        <div class="archive-card">
          <b>${site.name}</b>
          <span>素材接入后，这里会切换成可左右滑动的资料页。</span>
        </div>
        <div class="floating-hint">等待素材</div>
      `;
    }

    function renderSiteOverview(site) {
      setUiMode("overview");
      updatePlayerVisual(site, null);
      const slides = getSiteSlides(site);
      activeSlide = (activeSlide + slides.length) % slides.length;
      const slide = normalizeSlideEntry(slides[activeSlide]);
      const { type, title, text, payload: rowsOrBullets, meta } = slide;
      slideCard.dataset.slideType = type || "overview";

      chapterNumber.textContent = "总览";
      chapterTime.textContent = siteStatus(site);
      chapterDuration.textContent = "点左侧章节开始播放";
      chapterTitle.textContent = `${site.name} · 景点总览`;
      const sourceInfo = resolveChapterSourceLink(site, null);
      sourceLink.textContent = sourceInfo.title;
      sourceLink.href = sourceInfo.url;
      renderSourceStack(site, null);
      showAudioPlaceholder("点左侧章节开始播放");

      slideDeckTitle.textContent = `${site.name} · 总览资料页`;
      slideCounter.textContent = `${activeSlide + 1} / ${slides.length}`;
      slideTitle.textContent = polishVisibleText(title);
      slideBullets.innerHTML = getSlideBullets(type, rowsOrBullets, null, site, meta)
        .map(item => `<li>${displayText(item)}</li>`)
        .join("");
      renderSlideSupport(type, rowsOrBullets, null, site, meta);
      updateSlideCopyLayout({ chapter: null, bodyText: polishVisibleText(text) });

      slideKicker.innerHTML = `
        <span class="chip">${siteStatus(site)}</span>
        <span>景点总览</span>
        <span>${siteSourceLabel(site)}</span>
        <span>${(site.chapters || []).length} 个内容点</span>
        <span>${type === "image" ? "主视觉" : type === "shots" ? "建议顺序" : type === "diagram" ? "核心抓手" : type === "sources" ? "素材源" : type === "workflow" ? "发布策略" : "先看这页"}</span>
      `;

      renderVisual(type, title, text, rowsOrBullets, meta);
      renderDots(slides);
      slideCopy.scrollTop = 0;
    }

    function renderSlide() {
      const site = currentSite();
      const chapter = currentChapter();
      if (!site) {
        renderEmptySite(currentSite());
        return;
      }

      if (activeChapter < 0) {
        renderChapterList();
        renderSiteOverview(site);
        return;
      }

      if (!chapter) {
        renderEmptySite(site);
        return;
      }

      setUiMode("chapter");
      updatePlayerVisual(site, chapter);
      const slides = getSlides(chapter);
      activeSlide = (activeSlide + slides.length) % slides.length;
      const slide = normalizeSlideEntry(slides[activeSlide]);
      const { type, title, text, payload: rowsOrBullets, meta } = slide;
      slideCard.dataset.slideType = type || "archive";

      slideDeckTitle.textContent = `${chapter.title} · 资料页`;
      slideCounter.textContent = `${activeSlide + 1} / ${slides.length}`;
      slideTitle.textContent = polishVisibleText(title);

      const bullets = getSlideBullets(type, rowsOrBullets, chapter, site, meta);
      slideBullets.innerHTML = (bullets || []).map(item => `<li>${displayText(item)}</li>`).join("");
      renderSlideSupport(type, rowsOrBullets, chapter, site, meta);
      updateSlideCopyLayout({ chapter, bodyText: polishVisibleText(text) });
      const typeLabels = {
        "site-overview": "景点总览",
        sources: "素材源",
        workflow: "景点说明",
        "source-map": "来源概览",
        archive: "要点页",
        verify: "要点页",
        image: "现场图",
        diagram: "结构图",
        shots: "现场要点"
      };
      slideKicker.innerHTML = `
        <span class="chip">${twoDigit(activeChapter)}</span>
        <span>${chapter.time}</span>
        <span>${chapter.duration}</span>
        <span>${typeLabels[type] || "资料页"}</span>
        ${chapter.sourceLabel ? `<span>${chapter.sourceLabel}</span>` : ""}
      `;

      renderVisual(type, title, text, rowsOrBullets, meta);
      renderDots(slides);
      slideCopy.scrollTop = 0;
    }

    function renderDots(slides) {
      slideDots.innerHTML = "";
      slides.forEach((entry, index) => {
        const slide = normalizeSlideEntry(entry);
        const dot = document.createElement("button");
        dot.className = "dot" + (index === activeSlide ? " active" : "");
        dot.type = "button";
        dot.textContent = slideNavLabel(slide.type);
        dot.setAttribute("aria-label", `第 ${index + 1} 页：${slideNavLabel(slide.type)}`);
        dot.addEventListener("click", () => {
          activeSlide = index;
          renderSlide();
        });
        slideDots.appendChild(dot);
      });

      const activeDot = slideDots.querySelector(".dot.active");
      if (activeDot) {
        activeDot.scrollIntoView({ block: "nearest", inline: "center" });
      }
    }

    function setPlace(index, shouldPlay = false) {
      activeSite = (index + sites.length) % sites.length;
      activeChapter = -1;
      activeSlide = 0;
      renderPlaceList();
      document.title = `大同古迹导览 · ${currentSite().name}`;

      if (!currentChapters().length) {
        renderEmptySite(currentSite());
        return;
      }

      setChapter(-1, shouldPlay);
    }

    function setChapter(index, shouldPlay = false) {
      const chapters = currentChapters();
      if (!chapters.length) {
        renderEmptySite(currentSite());
        return;
      }

      activeChapter = normalizeChapterIndex(index, chapters.length);
      activeSlide = 0;
      const site = currentSite();
      const chapter = currentChapter();

      if (!chapter) {
        document.title = `大同古迹导览 · ${site.name}`;
        renderChapterList();
        renderSiteOverview(site);
        return;
      }

      chapterNumber.textContent = twoDigit(activeChapter);
      chapterTime.textContent = chapter.time;
      chapterDuration.textContent = chapter.duration;
      chapterTitle.textContent = chapter.title;
      const sourceInfo = resolveChapterSourceLink(site, chapter);
      sourceLink.textContent = sourceInfo.title;
      sourceLink.href = sourceInfo.url;
      renderSourceStack(site, chapter);
      const fusionMeta = getChapterFusionMeta(site, chapter);
      chapterFusionBadge.hidden = false;
      chapterFusionBadge.textContent = fusionMeta.badgeLabel;
      chapterFusionBadge.dataset.tone = fusionMeta.tone;
      updatePlayerVisual(site, chapter);
      loadChapterAudio(chapter, shouldPlay);
      document.title = `大同古迹导览 · ${site.name}`;

      renderChapterList();
      renderSlide();

      if (shouldPlay && activeChapter >= 0) {
        audioPlayer.play().catch(() => {});
      }
    }

    function nextSlide() {
      if (!currentChapters().length) return;
      activeSlide += 1;
      renderSlide();
    }

    function prevSlide() {
      if (!currentChapters().length) return;
      activeSlide -= 1;
      renderSlide();
    }

    document.getElementById("prevChapter").addEventListener("click", () => setChapter(activeChapter - 1, true));
    document.getElementById("nextChapter").addEventListener("click", () => setChapter(activeChapter + 1, true));
    document.getElementById("prevSlide").addEventListener("click", prevSlide);
    document.getElementById("nextSlide").addEventListener("click", nextSlide);

    playPauseButton.addEventListener("click", () => {
      if (!audioPlayer.getAttribute("src")) return;
      if (audioPlayer.paused || audioPlayer.ended) {
        audioPlayer.play().catch(() => {});
      } else {
        audioPlayer.pause();
      }
    });

    muteButton.addEventListener("click", () => {
      audioPlayer.muted = !audioPlayer.muted;
      syncPlayerUi();
    });

    seekBar.addEventListener("input", () => {
      const duration = Number.isFinite(audioPlayer.duration) ? audioPlayer.duration : 0;
      if (!duration) return;
      audioPlayer.currentTime = (Number(seekBar.value) / 1000) * duration;
      syncPlayerUi();
    });

    audioPlayer.addEventListener("play", () => {
      setPlayerState("正在播放");
      syncPlayerUi();
    });
    audioPlayer.addEventListener("pause", () => {
      if (!audioPlayer.ended && audioPlayer.currentTime > 0) {
        setPlayerState("已暂停");
      }
      syncPlayerUi();
    });
    audioPlayer.addEventListener("ended", () => {
      setPlayerState("播放完成");
      syncPlayerUi();
    });
    audioPlayer.addEventListener("loadedmetadata", () => {
      if (activeChapter >= 0) {
        setPlayerState(audioPlayer.dataset.loadedStateLabel || "音频已载入");
        delete audioPlayer.dataset.loadedStateLabel;
      }
      syncPlayerUi();
    });
    audioPlayer.addEventListener("error", () => {
      const fallbackSrc = audioPlayer.dataset.fallbackSrc;
      const currentSrc = audioPlayer.getAttribute("src") || "";
      if (fallbackSrc && currentSrc !== fallbackSrc) {
        showAudioPlayer(fallbackSrc, "original", "增强版未就绪，已切回原始音频");
        if (audioPlayer.dataset.shouldAutoplay === "1") {
          audioPlayer.play().catch(() => {});
        }
        return;
      }

      setPlayerState("音频加载失败");
    });
    audioPlayer.addEventListener("timeupdate", syncPlayerUi);
    audioPlayer.addEventListener("volumechange", syncPlayerUi);

    if (window.PointerEvent) {
      slideCard.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) return;
        beginSlideGesture(event.clientX, event.clientY);
      }, { passive: true });

      slideCard.addEventListener("pointerup", event => {
        endSlideGesture(event.clientX, event.clientY);
      }, { passive: true });

      slideCard.addEventListener("pointercancel", resetSlideGesture, { passive: true });
    } else {
      slideCard.addEventListener("touchstart", event => {
        const touch = event.changedTouches[0];
        beginSlideGesture(touch.clientX, touch.clientY);
      }, { passive: true });

      slideCard.addEventListener("touchend", event => {
        const touch = event.changedTouches[0];
        endSlideGesture(touch.clientX, touch.clientY);
      }, { passive: true });
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") prevSlide();
      if (event.key === "ArrowRight") nextSlide();
      if (event.key === "ArrowUp") setChapter(activeChapter - 1, true);
      if (event.key === "ArrowDown") setChapter(activeChapter + 1, true);
    });

    syncPlayerUi();
    renderPlaceList();
    setPlace(0);
  </script>
</body>
</html>
