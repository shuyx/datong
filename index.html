<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>大同古迹导览</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23b6422c'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-family='serif' fill='white'%3E同%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f7faf8;
      --ink: #17211f;
      --muted: #60706b;
      --line: #d7e1dd;
      --panel: #ffffff;
      --panel-soft: #eef5f2;
      --teal: #0d6d67;
      --teal-dark: #074f4b;
      --cinnabar: #b6422c;
      --gold: #b58c42;
      --shadow: 0 16px 48px rgba(20, 36, 33, 0.13);
      --radius: 8px;
      --rail: 218px;
      --player: 86px;
      --player-art: 64px;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(13, 109, 103, 0.06), transparent 36%),
        var(--paper);
      color: var(--ink);
    }

    button,
    audio {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr);
      height: 100dvh;
      min-height: 680px;
    }

    .rail {
      min-width: 0;
      height: 100dvh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      padding: 16px 12px;
    }

    .brand {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .seal {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #fff;
      background: var(--cinnabar);
      font-family: "Songti SC", "STSong", serif;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(182, 66, 44, 0.2);
    }

    .brand h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: 19px;
      line-height: 1.12;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .place-list {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }

    .place {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-height: 32px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
    }

    .place.active {
      color: var(--ink);
      border-color: rgba(13, 109, 103, 0.36);
      background: rgba(13, 109, 103, 0.08);
      font-weight: 700;
    }

    .place small {
      color: var(--teal-dark);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .place.pending small {
      color: var(--gold);
    }

    .rail-title {
      margin: 15px 0 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .chapters {
      display: grid;
      gap: 6px;
      padding-bottom: 18px;
    }

    .empty-state {
      padding: 14px 8px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      background: rgba(255, 255, 255, 0.56);
    }

    .empty-state span {
      display: block;
      margin-top: 4px;
      font-size: 10px;
    }

    .chapter-button {
      width: 100%;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      min-height: 48px;
      padding: 8px 7px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .chapter-button:hover,
    .chapter-button:focus-visible {
      outline: none;
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.86);
    }

    .chapter-button.active {
      border-color: rgba(13, 109, 103, 0.4);
      background: #fff;
      box-shadow: 0 8px 22px rgba(20, 36, 33, 0.08);
    }

    .chapter-button.overview .chapter-index {
      border-left-color: rgba(181, 140, 66, 0.4);
      color: var(--gold);
    }

    .chapter-button.overview.active .chapter-index {
      border-left-color: var(--gold);
      color: var(--gold);
    }

    .chapter-index {
      min-width: 24px;
      padding-left: 5px;
      border-left: 3px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.3;
    }

    .chapter-button.active .chapter-index {
      border-left-color: var(--cinnabar);
      color: var(--cinnabar);
    }

    .chapter-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.3;
    }

    .chapter-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .chapter-time {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.3;
    }

    .chapter-source {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      padding: 1px 6px;
      border: 1px solid rgba(13, 109, 103, 0.16);
      border-radius: 999px;
      background: rgba(13, 109, 103, 0.08);
      color: var(--teal-dark);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .chapter-source[data-tone="fusion"] {
      border-color: rgba(13, 109, 103, 0.24);
      background: rgba(13, 109, 103, 0.1);
    }

    .chapter-source[data-tone="support"] {
      border-color: rgba(181, 140, 66, 0.24);
      background: rgba(181, 140, 66, 0.12);
      color: #8a5921;
    }

    .chapter-source[data-tone="single"] {
      border-color: rgba(91, 103, 99, 0.18);
      background: rgba(91, 103, 99, 0.08);
      color: #5d6c67;
    }

    main {
      min-width: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(13, 109, 103, 0.04), rgba(13, 109, 103, 0) 18%),
        #f7faf8;
    }

    .player-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 37%) auto;
      gap: 14px;
      align-items: center;
      min-width: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 248, 0.92);
      backdrop-filter: blur(18px);
      z-index: 4;
      box-shadow: 0 10px 26px rgba(23, 33, 31, 0.05);
    }

    .player-frame {
      min-width: 0;
      display: grid;
      grid-template-columns: var(--player-art) minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .player-art-shell {
      width: var(--player-art);
      height: var(--player-art);
      overflow: hidden;
      border: 1px solid rgba(13, 109, 103, 0.12);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(13, 109, 103, 0.1), rgba(182, 66, 44, 0.06)),
        #f1f7f4;
      box-shadow: 0 10px 22px rgba(20, 36, 33, 0.08);
    }

    .player-art-shell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .player-sound {
      min-width: 0;
      display: grid;
      align-items: center;
    }

    .player-meta {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .source {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      min-width: 0;
    }

    .player-state {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 1px 7px;
      border: 1px solid rgba(13, 109, 103, 0.16);
      border-radius: 999px;
      background: rgba(13, 109, 103, 0.08);
      color: var(--teal-dark);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .audio-mode-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 1px 7px;
      border: 1px solid rgba(13, 109, 103, 0.16);
      border-radius: 999px;
      background: rgba(13, 109, 103, 0.08);
      color: var(--teal-dark);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .audio-mode-badge[data-tone="original"] {
      border-color: rgba(155, 98, 49, 0.24);
      background: rgba(155, 98, 49, 0.1);
      color: #8c4d20;
    }

    .chapter-fusion-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 1px 7px;
      border: 1px solid rgba(13, 109, 103, 0.16);
      border-radius: 999px;
      background: rgba(247, 250, 248, 0.92);
      color: var(--teal-dark);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chapter-fusion-badge[data-tone="support"] {
      border-color: rgba(181, 140, 66, 0.22);
      background: rgba(181, 140, 66, 0.12);
      color: #8a5921;
    }

    .chapter-fusion-badge[data-tone="single"] {
      border-color: rgba(91, 103, 99, 0.18);
      background: rgba(91, 103, 99, 0.08);
      color: #5d6c67;
    }

    .source a {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--teal-dark);
      text-decoration: none;
      border-bottom: 1px solid rgba(13, 109, 103, 0.28);
    }

    .source-stack {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: auto hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .source-stack[hidden] {
      display: none;
    }

    .source-stack::-webkit-scrollbar {
      display: none;
    }

    .source-pill {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      padding: 3px 8px;
      border: 1px solid rgba(13, 109, 103, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      color: var(--teal-dark);
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(23, 33, 31, 0.04);
    }

    .source-pill:hover,
    .source-pill:focus-visible {
      outline: none;
      border-color: rgba(13, 109, 103, 0.34);
      background: rgba(247, 250, 248, 0.98);
    }

    .source-pill[data-tone="primary"] {
      border-color: rgba(13, 109, 103, 0.22);
      background: rgba(13, 109, 103, 0.08);
    }

    .source-pill[data-tone="support"] {
      border-color: rgba(181, 140, 66, 0.18);
      background: rgba(181, 140, 66, 0.08);
      color: #7a5523;
    }

    .source-pill-role {
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--cinnabar);
    }

    .source-pill[data-tone="support"] .source-pill-role {
      color: #8c5a24;
    }

    .source-pill-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
    }

    .now-title {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "Songti SC", "STSong", serif;
      font-size: 23px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .now-sub {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      min-width: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--teal-dark);
      font-weight: 700;
    }

    .audio-native {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .player-sound {
      min-width: 0;
      display: grid;
      align-items: center;
    }

    .player-controls {
      min-width: 0;
      min-height: 46px;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid rgba(13, 109, 103, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 22px rgba(23, 33, 31, 0.05);
    }

    .player-controls[hidden] {
      display: none;
    }

    .player-control {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(13, 109, 103, 0.14);
      border-radius: 50%;
      background: #fff;
      color: var(--teal-dark);
      cursor: pointer;
    }

    .player-control:hover,
    .player-control:focus-visible {
      outline: none;
      border-color: rgba(13, 109, 103, 0.34);
      background: rgba(13, 109, 103, 0.06);
    }

    .player-control svg {
      width: 16px;
      height: 16px;
    }

    .player-control.playing {
      background: var(--teal);
      color: #fff;
      border-color: transparent;
    }

    .time-pill {
      color: #33403c;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .player-range {
      width: 100%;
      margin: 0;
      accent-color: var(--teal);
    }

    .audio-placeholder {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px dashed rgba(13, 109, 103, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
    }

    .audio-placeholder[hidden] {
      display: none;
    }

    .chapter-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      outline: none;
      border-color: rgba(13, 109, 103, 0.52);
      background: rgba(13, 109, 103, 0.06);
      color: var(--teal-dark);
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
    }

    .deck {
      min-width: 0;
      min-height: 0;
      padding: 8px 10px 10px;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }

    .slide-card {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
      touch-action: pan-y;
    }

    .slide-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 44px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .slide-head h2 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      line-height: 1.2;
    }

    .slide-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    body[data-mode="overview"] {
      --player: 76px;
    }

    body[data-mode="overview"] .player-bar,
    body[data-mode="empty"] .player-bar {
      gap: 10px;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    body[data-mode="overview"] .player-frame,
    body[data-mode="empty"] .player-frame {
      grid-template-columns: minmax(0, 1fr);
    }

    body[data-mode="overview"] .player-art-shell,
    body[data-mode="empty"] .player-art-shell {
      display: none;
    }

    body[data-mode="overview"] .now-title,
    body[data-mode="empty"] .now-title {
      font-size: 21px;
    }

    body[data-mode="overview"] .audio-placeholder,
    body[data-mode="empty"] .audio-placeholder {
      min-height: 38px;
      font-size: 11px;
    }

    body[data-mode="chapter"] .deck {
      padding: 0;
    }

    body[data-mode="chapter"] .player-bar {
      gap: 12px;
      padding: 6px 10px 7px;
      background: rgba(249, 251, 249, 0.96);
      box-shadow: 0 8px 24px rgba(23, 33, 31, 0.06);
    }

    body[data-mode="chapter"] .player-meta {
      gap: 4px;
    }

    body[data-mode="chapter"] .source {
      gap: 6px;
      font-size: 10px;
    }

    body[data-mode="chapter"] .now-title {
      font-size: 20px;
    }

    body[data-mode="chapter"] .now-sub {
      gap: 6px;
      row-gap: 3px;
    }

    body[data-mode="chapter"] .player-controls {
      min-height: 42px;
      padding: 6px 10px;
    }

    body[data-mode="chapter"] .slide-card {
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background:
        linear-gradient(180deg, rgba(13, 109, 103, 0.03), rgba(13, 109, 103, 0)),
        #fbfdfc;
    }

    body[data-mode="chapter"] .slide-head {
      min-height: 40px;
      padding: 8px 14px;
      background: rgba(251, 253, 252, 0.92);
      backdrop-filter: blur(18px);
    }

    body[data-mode="chapter"] .slide-head h2 {
      font-size: 14px;
    }

    body[data-mode="chapter"] .slide-count {
      font-size: 11px;
      font-weight: 700;
    }

    body[data-mode="chapter"] .slide-main {
      grid-template-columns: minmax(0, 1.42fr) minmax(224px, 0.58fr);
      background:
        linear-gradient(90deg, rgba(13, 109, 103, 0.04), rgba(13, 109, 103, 0) 44%),
        #fbfdfc;
    }

    body[data-mode="chapter"] .slide-card[data-slide-type="image"] .slide-main {
      grid-template-columns: minmax(0, 1.5fr) minmax(196px, 0.5fr);
    }

    body[data-mode="chapter"] .slide-visual {
      background-size: 38px 38px;
    }

    body[data-mode="chapter"] .slide-copy {
      align-content: center;
      padding: 16px 16px 14px;
      gap: 10px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.98)),
        rgba(255, 255, 255, 0.92);
    }

    body[data-mode="chapter"] .slide-copy h3 {
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.04;
    }

    body[data-mode="chapter"] .slide-copy[data-layout="brief"] {
      gap: 8px;
    }

    body[data-mode="chapter"] .slide-copy[data-layout="brief"] h3 {
      font-size: clamp(24px, 3.8vw, 40px);
    }

    body[data-mode="chapter"] .slide-kicker {
      gap: 6px;
      font-size: 11px;
    }

    body[data-mode="chapter"] .slide-facts,
    body[data-mode="chapter"] .slide-bullets {
      gap: 8px;
    }

    body[data-mode="chapter"] .slide-bullets li {
      padding: 10px 12px;
    }

    body[data-mode="chapter"] .slide-foot {
      min-height: 44px;
      padding: 6px 12px;
      background: rgba(251, 253, 252, 0.92);
      backdrop-filter: blur(18px);
    }

    body[data-mode="chapter"] .text-button {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 12px;
    }

    body[data-mode="chapter"] .dots {
      gap: 6px;
    }

    .slide-main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(300px, 0.82fr);
      background:
        linear-gradient(160deg, rgba(13, 109, 103, 0.06), transparent 40%),
        #fbfdfc;
    }

    .slide-card[data-slide-type="image"] .slide-main {
      grid-template-columns: minmax(0, 1.34fr) minmax(248px, 0.66fr);
    }

    .slide-visual {
      min-width: 0;
      min-height: 0;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background:

    function uniqueReferenceImages(items = []) {
      const seen = new Set();
      return items
        .filter(item => item && item.src)
        .map(item => enrichReferenceItem(item))
        .filter(item => {
          if (seen.has(item.src)) return false;
          seen.add(item.src);
          return true;
        });
    }

    function siteReferenceKey(siteOrKey) {
      const raw = typeof siteOrKey === "string" ? siteOrKey : (siteOrKey?.id || "");
      if (raw === "shanhuasi") return "shanhua";
      return raw;
    }

    function allReferenceImages() {
      return Object.values(referenceImageSets).flat().filter(Boolean);
    }

    function lookupReferenceImage(src) {
      return allReferenceImages().find(item => item.src === src) || null;
    }

    function enrichReferenceItem(item = {}) {
      if (!item?.src) return item;
      const base = lookupReferenceImage(item.src) || {};
      const keywords = [
        ...(Array.isArray(base.keywords) ? base.keywords : []),
        ...(Array.isArray(item.keywords) ? item.keywords : [])
      ];
      return {
        ...base,
        ...item,
        keywords: [...new Set(keywords.filter(Boolean))]
      };
    }

    function normalizeVisualText(value) {
      return String(value ?? "")
        .toLowerCase()
        .replaceAll("％", "%")
        .replace(/[\s"'“”‘’`·,，.。:：;；!！?？()[\]{}<>《》【】、/\\|_-]+/g, "");
    }

    function collectVisualText(value, depth = 0) {
      if (value == null || depth > 4) return [];
      if (typeof value === "string" || typeof value === "number") return [String(value)];
      if (Array.isArray(value)) return value.flatMap(item => collectVisualText(item, depth + 1));
      if (typeof value === "object") return Object.values(value).flatMap(item => collectVisualText(item, depth + 1));
      return [];
    }

    function imageCandidateWords(item = {}) {
      const explicit = Array.isArray(item.keywords) ? item.keywords : [];
      const implicit = [item.alt, item.title, item.caption, item.chip]
        .filter(Boolean)
        .flatMap(value => String(value).split(/[\s,，、/·|｜:：;；()（）【】《》"'""]+/))
        .filter(value => value && value.length > 1);
      return [...new Set([...explicit, ...implicit])];
    }

    function visualRuleMatches(rule, queryText, site, chapter) {
      const key = siteReferenceKey(site);
      if (rule.site && siteReferenceKey(rule.site) !== key) return false;
      if (rule.chapterId && rule.chapterId !== chapter?.id) return false;
      const haystack = normalizeVisualText(queryText);
      const any = Array.isArray(rule.any) ? rule.any : [];
      const all = Array.isArray(rule.all) ? rule.all : [];
      const has = value => {
        const needle = normalizeVisualText(value);
        return needle && haystack.includes(needle);
      };
      return (!all.length || all.every(has)) && (!any.length || any.some(has));
    }

    function pickVisualRuleItem(items = [], queryText = "", site, chapter) {
      const refs = uniqueReferenceImages(items);
      for (const rule of visualImageRules) {
        if (!visualRuleMatches(rule, queryText, site, chapter)) continue;
        const matched = refs.find(item => item.src === rule.src) || lookupReferenceImage(rule.src);
        if (matched?.src) {
          return enrichReferenceItem({ ...matched, priority: 999, chip: "页面匹配" });
        }
      }
      return null;
    }

    function isRawChapterFrame(src = "") {
      return /assets\/images\/(yingxian|shanhuasi|huayan|yungang|xuankong)-\d/.test(src)
        || /assets\/images\/(huayan-temple-cover|yungang-caves-cover|xuankong-temple-cover)\.jpg/.test(src);
    }

    function scoreVisualCandidate(item = {}, queryText = "") {
      const haystack = normalizeVisualText(queryText);
      const words = imageCandidateWords(enrichReferenceItem(item));
      let score = Number(item.priority || 0);
      let hasDirectMatch = false;

      words.forEach(word => {
        const needle = normalizeVisualText(word);
        if (!needle || needle.length < 2) return;
        if (visualStopwords.has(needle)) return;
        if (haystack.includes(needle)) {
          hasDirectMatch = true;
          score += Math.min(28, 8 + needle.length);
          return;
        }

        const caveMatch = needle.match(/第?\d+窟/);
        if (caveMatch && haystack.includes(caveMatch[0])) {
          score += 18;
        }

        if (needle.length >= 4 && haystack.includes(needle.slice(0, 4))) {
          score += 4;
        }
      });

      if (item.src?.includes("/reference/")) score += 8;
      if (item.strict && !hasDirectMatch) score -= 70;
      if (isRawChapterFrame(item.src)) score -= 90;
      return score;
    }

    function pickBestReferenceItem(items = [], queryText = "", offset = 0) {
      const refs = uniqueReferenceImages(items);
      if (!refs.length) return null;
      const scored = refs
        .map((item, index) => ({ item, index, score: scoreVisualCandidate(item, queryText) }))
        .sort((a, b) => b.score - a.score || a.index - b.index);
      const bestScore = scored[0]?.score ?? 0;
      const close = scored.filter(item => item.score >= bestScore - 12);
      const pool = close.length ? close : scored;
      return pool[Math.abs(offset) % pool.length]?.item || scored[0]?.item || null;
    }

    function slideVisualQuery(type, title, text, rowsOrBullets, meta = {}, site, chapter) {
      return [
        type,
        title,
        text,
        meta,
        rowsOrBullets,
        chapter?.title,
        chapter?.summary,
        site?.name
      ].flatMap(item => collectVisualText(item)).join(" ");
    }

    function slideVisualRuleQuery(type, title, text, rowsOrBullets, meta = {}) {
      return [
        type,
        title,
        text,
        meta,
        rowsOrBullets
      ].flatMap(item => collectVisualText(item)).join(" ");
    }

    function getSiteReferenceImages(site) {
      return uniqueReferenceImages(referenceImageSets[siteReferenceKey(site)] || []);
    }

    function getVisualMediaCandidates(site, chapter, fallbackSrc = "", fallbackAlt = "", fallbackCaption = "") {
      const candidates = [];
      const push = (item, priority = 0, chip = "") => {
        if (!item?.src) return;
        candidates.push(enrichReferenceItem({
          ...item,
          priority: Number(item.priority || 0) + priority,
          chip: item.chip || chip
        }));
      };

      (chapterReferenceOverrides[chapter?.id] || []).forEach(item => push(item, 18, "本章参考"));
      getSiteReferenceImages(site).forEach(item => push(item, 4, "景点参考"));
      if (fallbackSrc) {
        push({
          src: fallbackSrc,
          alt: fallbackAlt,
          title: chapter?.title || site?.name || "",
          caption: fallbackCaption || chapter?.summary || site?.imageCaption || ""
        }, isRawChapterFrame(fallbackSrc) ? -80 : -4, chapter ? "本章原图" : "景点主图");
      }
      if (site?.image && site.image !== fallbackSrc) {
        push({
          src: site.image,
          alt: site.imageAlt || `${site.name}总览`,
          title: site.name,
          caption: site.imageCaption || ""
        }, isRawChapterFrame(site.image) ? -80 : -8, "景点主图");
      }

      return uniqueReferenceImages(candidates);
    }

    function selectBestVisualMediaItem(type, title, text, rowsOrBullets, meta = {}, site, chapter) {
      const fallbackSrc = typeof rowsOrBullets === "string"
        ? (meta.imageSrc || rowsOrBullets)
        : (meta.imageSrc || chapter?.image || site?.image || "");
      const fallbackAlt = chapter
        ? `${site?.name || "景点"} · ${chapter.title}`
        : (site?.imageAlt || title || "资料图");
      const fallbackCaption = chapter?.summary || text || site?.imageCaption || "";
      const candidates = getVisualMediaCandidates(site, chapter, fallbackSrc, fallbackAlt, fallbackCaption);
      const query = slideVisualQuery(type, title, text, rowsOrBullets, meta, site, chapter);
      const ruleQuery = slideVisualRuleQuery(type, title, text, rowsOrBullets, meta);
      const picked = pickVisualRuleItem(candidates, ruleQuery, site, chapter)
        || pickBestReferenceItem(candidates, query, Math.max(0, activeSlide || 0));
      if (picked?.src) {
        return {
          ...picked,
          alt: picked.alt || fallbackAlt || title || "资料图"
        };
      }
      return {
        src: fallbackSrc || "",
        alt: fallbackAlt || title || "资料图"
      };
    }

    function buildReferenceSpotlight(siteKey, chapter, primaryImage) {
      const library = referenceImageSets[siteKey] || [];
      const chapterRefs = chapterReferenceOverrides[chapter.id] || [];
      const defaultRefs = library.length
        ? library
        : (primaryImage ? [{ src: primaryImage, alt: `${chapter.title} 当前章节画面` }] : []);
      const refs = uniqueReferenceImages(chapterRefs.length ? chapterRefs : defaultRefs);
      const focus = (chapter.shots || []).filter(Boolean);
      const fallbackFocus = focus.length ? focus : [chapter.title, chapter.summary || chapter.title];
      const verbs = ["先看", "再看", "最后看"];
      const captions = [
        "先找画面里最醒目的对象，别急着扫全场。",
        "再看它旁边的结构、人物或位置关系。",
        "最后退一步，把这一处和整段讲解连起来。"
      ];
      const steps = fallbackFocus.slice(0, 3).map((label, index) => {
        const cleanedLabel = String(label || chapter.title).trim();
        const query = `${cleanedLabel} ${chapter.title} ${chapter.summary || ""}`;
        const ruleQuery = cleanedLabel;
        const ref = pickBestReferenceItem(
          refs,
          query,
          index
        );
        const ruleRef = pickVisualRuleItem(refs, ruleQuery, siteKey, chapter);
        const visualRef = ruleRef || ref || refs[index % refs.length] || refs[0] || { src: primaryImage || chapterImagePath(chapter.id), alt: chapter.title };
        return {
          label: cleanedLabel,
          chip: `知识点 ${String(index + 1).padStart(2, "0")}`,
          title: `${verbs[index] || "再看"}${cleanedLabel}`,
          text: index === 0
            ? `看${cleanedLabel}本身：它是这一段最先要认出的对象。`
            : index === 1
              ? `再看${cleanedLabel}和周围环境的关系，很多判断藏在位置和比例里。`
              : `最后回到${cleanedLabel}，用这一处把刚才听到的内容收住。`,
          src: visualRef.src,
          alt: visualRef.alt || `${chapter.title} 参考图`,
          caption: captions[index] || captions[captions.length - 1]
        };
      });

      return [
        "spotlight",
        `${chapter.title} · 知识点`,
        chapter.summary || "把这一段拆成几个可以逐页看的知识点。",
        {
          kicker: "知识点逐页讲",
          steps
        },
        { compact: true }
      ];
    }

    function ensureReferenceSpotlightSlides(slides, siteKey, chapter, primaryImage) {
      const safeSlides = Array.isArray(slides) ? slides : [];
      if (safeSlides.some(slide => Array.isArray(slide) && slide[0] === "spotlight")) {
        return safeSlides;
      }
      const spotlight = buildReferenceSpotlight(siteKey, chapter, primaryImage);
      return expandSpotlightSlides([
        safeSlides[0],
        spotlight,
        ...safeSlides.slice(1)
      ].filter(Boolean));
    }

    function expandSpotlightSlides(slides = []) {
      return slides.flatMap(slide => {
        if (!Array.isArray(slide) || slide[0] !== "spotlight") {
          return [slide];
        }

        const [type, title, text, payload = {}, meta = {}] = slide;
        const steps = Array.isArray(payload?.steps) ? payload.steps.filter(Boolean) : [];
        if (steps.length <= 1) {
          return [slide];
        }

        return steps.map((step, index) => [
          type,
          step.title || title,
          step.text || text,
          {
            ...payload,
            steps: [step],
            focusIndex: index + 1,
            focusTotal: steps.length,
            focusGroupTitle: title
          },
          {
            ...meta,
            bullets: Array.isArray(meta?.bullets) ? [meta.bullets[index]].filter(Boolean) : [],
            facts: Array.isArray(meta?.facts) ? meta.facts : []
          }
        ]);
      });
    }

      const [first, second, third] = chapter.shots || [];
      if (tone === "应县木塔") {

          `再看${second || first || chapter.title}，找出这一窟最有辨识度的图像。`,

      if (tone === "华严寺") {
        return expandSpotlightSlides([
          `先看${first || chapter.title}，确定这一殿的主角。`,
          `再看${second || first || chapter.title}，把殿堂空间和造像关系对上。`,
          `最后看${third || second || first || chapter.title}，记住这一殿最容易被忽略的细节。`

      if (tone === "善化寺") {
        return [
          `先看${first || chapter.title}，确认它在中轴线上的位置。`,
          `再看${second || first || chapter.title}，分清建筑、塑像或碑刻的关系。`,
          `最后看${third || second || first || chapter.title}，把这一站和下一站接起来。`
        ];
      }

      return [
        `先看 ${first || chapter.title}。`,
        `再看 ${second || first || chapter.title}。`,
        `最后看 ${third || second || first || chapter.title}。`
      ];
    }

    function buildYingxianSlides(chapter) {
      const image = chapterImagePath(chapter.id);
      const support = getYingxianSlideSupport()[chapter.id] || {};
      const archive = support.archive || {};
      const diagram = support.diagram || {};
      const imageMeta = support.image || {};
      const spotlight = support.spotlight || {};

      const slides = [
        [
          "archive",
          archive.title || `这一段先抓：${chapter.title}`,
          archive.text || `${chapter.summary} 这一页先把最值得记住的主线压缩出来。`,
          archive.items || chapter.shots,
          {
            facts: archive.facts || [
              { label: "音频区间", value: chapter.time },
              { label: "时长", value: chapter.duration },
              { label: "第一抓手", value: chapter.shots?.[0] || chapter.title },
              { label: "第二抓手", value: chapter.shots?.[1] || chapter.shots?.[0] || chapter.title }
            ],
            bullets: archive.bullets || buildObservationBullets(chapter, "应县木塔"),
            noteLabel: archive.noteLabel || "先抓主线",
            note: archive.note || "木塔最怕一口气背名词，先把这一段的主轴抓住，后面细节才会自己归位。"
          }
        ]
      ];

      if (Array.isArray(spotlight.steps) && spotlight.steps.length) {
        slides.push([
          "spotlight",
          spotlight.title || "这一段最适合点着看",
          spotlight.text || "把几张参考图按顺序点一遍，会比只看一张远景更容易知道这一章到底该看哪里。",
          {
            kicker: spotlight.kicker || "看图顺序页",
            steps: spotlight.steps
          },
          {
            facts: spotlight.facts || [
              { label: "先看", value: chapter.shots?.[0] || chapter.title },
              { label: "第二眼", value: chapter.shots?.[1] || chapter.shots?.[0] || chapter.title },
              { label: "第三眼", value: chapter.shots?.[2] || chapter.shots?.[1] || chapter.title },
              { label: "这页角色", value: "把观察顺序变具体" }
            ],

              `先让 ${chapter.shots?.[0] || chapter.title} 这条线成为第一眼。`,

    function buildYungangSlides(chapter) {
      const support = getYungangSlideSupport()[chapter.id] || {};
      const fusion = yungangFusionSources[chapter.id] || {
        primary: `${chapter.sourceLabel} · 当前主讲`,
        supporting: []
      };
      const supportingText = fusion.supporting.length
        ? fusion.supporting.join(" / ")
        : "当前以单源切段为准";
      const sourceStrategyNote = fusion.supporting.length
        ? "这一章先保留主来源音频，把补充来源并进同章资料页；只有当补充内容足以改变叙事结构时，才值得二次整稿和重录。"
        : "这一章目前仍以单源讲解为主，先把现场收听和资料页理解做扎实；若后续出现明显补强主线的新资料，再考虑整稿重录。";

      const archiveSupport = support.archive || {};
      const diagramSupport = support.diagram || {};
      const imageSupport = support.image || {};
      const spotlight = support.spotlight || {};

      const slides = [
        [
          "archive",
          archiveSupport.title || chapter.title,
          archiveSupport.text || `${chapter.summary} 这一页先把窟号、时代位置和最值得停下来的细节压成一页。`,
          archiveSupport.payload || chapter.shots,
          {
            facts: archiveSupport.facts || [
              { label: "主来源", value: fusion.primary },
              { label: "补充来源", value: supportingText },
              { label: "本章焦点", value: chapter.shots[0] || chapter.title },

            ],
            bullets: archiveSupport.bullets,
            noteLabel: archiveSupport.noteLabel || "融合策略",
            note: archiveSupport.note || sourceStrategyNote

      ];

      if (Array.isArray(spotlight.steps) && spotlight.steps.length) {
        slides.push([
          "spotlight",
          spotlight.title || "这一段最适合点着看",
          spotlight.text || "把几张参考图按顺序点一遍，会比只看一张总图更容易知道这一章该怎么进入。",

              `${chapter.shots?.[2] || chapter.shots?.[1] || chapter.title} 最适合把这一章从名词变成画面。`
            ],
            noteLabel: spotlight.noteLabel || "怎么看",
            note: spotlight.note || "这一页最适合跟着音频一张张点，让本来容易抽象的内容直接挂到图片上。"

      slides.push(
        [
          "diagram",
          diagramSupport.title || chapter.shots[0],
          diagramSupport.text || "这一页最适合把窟号、人物关系、分期差异和图像来源的连接关系压成一张图，而不是照搬音频原话。",
          diagramSupport.payload || chapter.shots,
          {
            facts: diagramSupport.facts || [
              { label: "关系图入口", value: chapter.shots[0] || chapter.title },

              { label: "来源结构", value: fusion.supporting.length ? "主段 + 补段" : "当前单段主讲" },

            note: diagramSupport.note || (fusion.supporting.length
              ? `这一页最适合继续把 ${supportingText} 的细节并到同一张窟号关系图里。`

        [
          "image",
          imageSupport.title || chapter.shots[1] || chapter.title,

          {

            bullets: imageSupport.bullets,
            noteLabel: imageSupport.noteLabel || "画面补强",

    function compactSourceLabel(value) {

    function resolveSourceByLabel(site, label) {
      const target = compactSourceLabel(label);
      if (!target) return null;
      return (site?.overview?.sources || []).find(item => compactSourceLabel(item.label) === target) || null;
    }

    function getChapterFusionBreakdown(site, chapter) {
      if (!chapter) {
        return {
          profile: { primary: "", supporting: [], multiSourceSite: false },
          primaryDescriptor: "",
          primaryInfo: { label: "", detail: "" },
          supportDescriptors: [],
          supportInfos: [],
          uniqueSourceLabels: [],
          uniqueSourceCount: 0,
          descriptorCount: 0,
          sameSourceSupportCount: 0,
          uniqueSupportLabels: [],
          uniqueSupportCount: 0,
          pending: false,
          hasAnySupplement: false
        };
      }

      const profile = chapterSourceProfile(site, chapter);
      const primaryDescriptor = String(profile.primary || chapter.sourceLabel || site?.name || "").trim();
      const primaryInfo = parseSourceDescriptor(primaryDescriptor);
      const supportDescriptors = (profile.supporting || [])
        .map(item => String(item || "").trim())
        .filter(Boolean);
      const supportInfos = supportDescriptors.map(item => ({
        descriptor: item,
        pending: item.includes("待并入"),
        ...parseSourceDescriptor(item)
      }));
      const uniqueSourceLabels = [...new Set(
        [primaryInfo.label, ...supportInfos.map(item => item.label)]
          .filter(Boolean)
      )];
      const uniqueSupportLabels = [...new Set(
        supportInfos
          .map(item => item.label)
          .filter(Boolean)
          .filter(label => label !== primaryInfo.label)
      )];

      return {
        profile,
        primaryDescriptor,
        primaryInfo,
        supportDescriptors,
        supportInfos,
        uniqueSourceLabels,
        uniqueSourceCount: uniqueSourceLabels.length || (primaryInfo.label ? 1 : 0),
        descriptorCount: (primaryDescriptor ? 1 : 0) + supportDescriptors.length,
        sameSourceSupportCount: supportInfos.filter(item => item.label && item.label === primaryInfo.label).length,
        uniqueSupportLabels,
        uniqueSupportCount: uniqueSupportLabels.length,
        pending: supportInfos.some(item => item.pending),
        hasAnySupplement: supportDescriptors.length > 0
      };
    }

    function getChapterFusionMeta(site, chapter) {
      if (!chapter) {
        return {
          descriptorCount: 0,
          sourceCount: 0,
          supportingCount: 0,
          railLabel: "",
          badgeLabel: "",
          tone: "single",
          primaryLabel: ""
        };
      }

      const breakdown = getChapterFusionBreakdown(site, chapter);
      const primaryLabel = breakdown.primaryInfo.label || compactSourceLabel(chapter.sourceLabel || site?.name || "当前景点");

      if (!breakdown.hasAnySupplement) {
        return {
          descriptorCount: breakdown.descriptorCount || 1,
          sourceCount: breakdown.uniqueSourceCount || 1,
          supportingCount: 0,
          railLabel: "单源",
          badgeLabel: "单源直听",
          tone: "single",
          primaryLabel,
          pending: false
        };
      }

      if (breakdown.uniqueSourceCount > 1) {
        return {
          descriptorCount: breakdown.descriptorCount,
          sourceCount: breakdown.uniqueSourceCount,
          supportingCount: breakdown.uniqueSupportCount,
          railLabel: `${breakdown.uniqueSourceCount} 源`,
          badgeLabel: breakdown.pending ? `${breakdown.uniqueSourceCount} 源融合中` : `${breakdown.uniqueSourceCount} 源并章`,
          tone: breakdown.pending ? "support" : "fusion",
          primaryLabel,
          pending: breakdown.pending
        };
      }

      return {
        descriptorCount: breakdown.descriptorCount,
        sourceCount: 1,
        supportingCount: breakdown.sameSourceSupportCount,
        railLabel: `${breakdown.descriptorCount} 段`,
        badgeLabel: breakdown.pending ? `${breakdown.descriptorCount} 段整理中` : `${breakdown.descriptorCount} 段并章`,
        tone: breakdown.pending ? "support" : "fusion",
        primaryLabel,
        pending: breakdown.pending
      };
    }

    function sourceRoleStats(site, sourceItem) {
      const target = compactSourceLabel(sourceItem?.label);
      if (!target) {
        return {
          linkedCount: 0,
          primaryCount: 0,
          supportingCount: 0
        };
      }

      let primaryCount = 0;
      let supportingCount = 0;
      let linkedCount = 0;

      (site?.chapters || []).forEach(chapter => {
        const profile = chapterSourceProfile(site, chapter);
        const primary = compactSourceLabel(profile.primary || chapter.sourceLabel || site?.name || "当前景点");
        const supporting = (profile.supporting || []).map(item => compactSourceLabel(item)).filter(Boolean);
        const isPrimary = primary === target;
        const isSupporting = supporting.includes(target);

        if (isPrimary) primaryCount += 1;
        if (isSupporting) supportingCount += 1;
        if (isPrimary || isSupporting || compactSourceLabel(chapter.sourceLabel) === target) linkedCount += 1;
      });

      return {
        linkedCount,
        primaryCount,
        supportingCount
      };
    }

    function getSourceStackItems(site, chapter = null) {
      const overviewSources = site?.overview?.sources || [];

      if (!chapter) {
        return overviewSources.length > 1
          ? overviewSources.map((item, index) => ({
              tone: index === 0 ? "primary" : "support",
              role: index === 0 ? "主讲" : "补充",
              label: compactSourceLabel(item.label),
              title: `${item.label} · ${item.role || (index === 0 ? "当前主素材" : "补充来源")}`,
              url: item.url || ""
            }))
          : [];
      }

      const profile = chapterSourceProfile(site, chapter);
      const breakdown = getChapterFusionBreakdown(site, chapter);
      const stack = [];
      const primarySource = resolveSourceByLabel(site, profile.primary) || resolveSourceByLabel(site, chapter.sourceLabel);
      stack.push({
        tone: "primary",
        role: "主讲",
        label: compactSourceLabel(profile.primary || chapter.sourceLabel || site?.name || "当前景点"),
        title: profile.primary || chapter.sourceLabel || site?.name || "当前主讲",
        url: primarySource?.url || site?.sourceUrl || ""
      });

      (profile.supporting || []).forEach(item => {
        const matched = resolveSourceByLabel(site, item);
        stack.push({
          tone: "support",
          role: matched?.url ? "同章补充" : "待并入",
          label: compactSourceLabel(item),
          title: item,
          url: matched?.url || ""
        });
      });

      if (profile.multiSourceSite && overviewSources.length > 1 && breakdown.uniqueSourceCount > 1) {
        overviewSources
          .filter(item => compactSourceLabel(item.label) !== compactSourceLabel(primarySource?.label || profile.primary))
          .forEach(item => {
            stack.push({
              tone: "support",
              role: "站点补充",
              label: compactSourceLabel(item.label),
              title: `${item.label} · ${item.role || "站点补充来源"}`,
              url: item.url || ""
            });
          });
      }

      const seen = new Set();
      return stack.filter(item => {
        const key = item.label;
        if (!item.label || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderSourceStack(site, chapter = null) {
      const items = getSourceStackItems(site, chapter);
      if (!items.length || items.length < 2) {
        sourceStack.hidden = true;
        sourceStack.innerHTML = "";
        return;
      }

      sourceStack.hidden = false;
      sourceStack.innerHTML = items.map(item => {
        const tag = item.url ? "a" : "span";
        const href = item.url ? ` href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer“` : "";
        return `<${tag} class="source-pill" data-tone="${escapeHtml(item.tone)}" title="${escapeHtml(item.title)}"${href}><span class="source-pill-role">${escapeHtml(item.role)}</span><span class="source-pill-label">${escapeHtml(item.label)}</span></${tag}>`;
      }).join("");
    }
